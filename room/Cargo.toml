[package]
name = "room"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the doomgeneric platform layer using winit and wgpu"
repository = "https://github.com/sunsided/room"
license = "GPL-2.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
readme = "../README.md"

[lib]
name = "room"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "room"
path = "src/main.rs"

[features]
dhat-heap = ["dep:dhat"]
rangecheck = []

[dependencies]
# Cross-platform window creation and event handling.
winit = "0.30"

# Cross-platform GPU API.
wgpu = { version = "29", features = ["wgsl", "webgl"] }

# Blocking async executor – used to wait for wgpu futures.
pollster = "0.4"

# Safe transmutation between byte slices and typed buffers.
bytemuck = { version = "1", features = ["derive"] }

# Logging facade.
log = "0.4"

# Cross-platform audio playback, used for SFX.
rodio = "0.22"

# Pure-Rust SF2 soundfont synthesizer, used for Doom music playback.
rustysynth = "1"

# Simple logger backed by stderr.
env_logger = "0.11"

# Optional heap profiler (use with --features dhat-heap).
dhat = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# libc bindings for C FFI on native platforms
libc = "0.2"
# PNG brightmaps from the Brightmaps Plus pack.
image = { version = "0.25", default-features = false, features = ["png"] }
egui = "0.35"
egui-winit = "0.35"
egui-wgpu = { version = "0.35", features = ["winit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Minimal libc shim providing types and VFS for WebAssembly
libc_wasm = { package = "libc-wasm", path = "../libc-wasm" }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "console",
] }
web-time = "1.1"
console_error_panic_hook = "0.1"

[dev-dependencies]
# C layout-guard tests: compiles test_helpers.c to verify C struct offsets
# match the ported Rust equivalents. Only linked into the test binary.
doomgeneric-sys = { path = "../doomgeneric-sys" }
