<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wDoom</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #controls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    #controls button {
      background: rgba(30, 30, 30, 0.75);
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 12px;
      font: 12px monospace;
      cursor: pointer;
      backdrop-filter: blur(4px);
      user-select: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #controls button:hover {
      background: rgba(50, 50, 50, 0.9);
      color: #fff;
      border-color: #888;
    }
    #controls button.active {
      background: rgba(28, 100, 50, 0.85);
      border-color: #3cb86b;
      color: #fff;
    }
    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      color: #ccc;
      font: 14px sans-serif;
    }
    #status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="btn-bake" title="Toggle baked raytraced lightmap ([ or F6)">Bake: ON</button>
    <button id="btn-msaa" title="Toggle 4× hardware MSAA (\ or F7)">MSAA (4×): OFF</button>
    <button id="btn-smaa" title="Toggle post-pixelization SMAA (0)">SMAA: OFF</button>
    <button id="btn-ssrc" title="Toggle Screen-Space Radiance Cascades secondary bounce & explosion glow (] or F5)">SSRC: OFF</button>
    <button id="btn-clear-visible" title="Clear visible light and rebake what you see (F8)">Clear Visible</button>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;" title="Screen-Space Radiance Cascades: secondary bounce & explosion glow">
      SSRC:
      <input id="slider-ssrc" type="range" min="0" max="2.5" step="0.1" value="1.0" style="width:64px;vertical-align:middle;">
    </label>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;" title="Blend between normal Doom lighting (0%) and raytraced baked lighting (100%)">
      Blend:
      <input id="slider-blend" type="range" min="0" max="1.0" step="0.05" value="0.5" style="width:64px;vertical-align:middle;">
    </label>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;" title="Blend between normal Doom lighting (0%) and raytraced baked lighting (100%) for voxel/actor objects">
      Objects:
      <input id="slider-voxel-blend" type="range" min="0" max="1.0" step="0.05" value="0.4" style="width:64px;vertical-align:middle;">
    </label>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;" title="OG Doom distance diminishing: near surfaces are lit, far surfaces fall off into darkness">
      Diminish:
      <input id="slider-diminish" type="range" min="0" max="3.0" step="0.05" value="1.5" style="width:64px;vertical-align:middle;">
    </label>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;">
      Bounce:
      <input id="slider-bounce" type="range" min="0.5" max="3.0" step="0.1" value="1.8" style="width:64px;vertical-align:middle;">
    </label>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;">
      Bump:
      <input id="slider-normal" type="range" min="0" max="2.5" step="0.1" value="1.0" style="width:64px;vertical-align:middle;">
    </label>
    <label style="color:#bbb;font:12px monospace;display:flex;align-items:center;gap:4px;background:rgba(20,20,20,0.7);padding:2px 8px;border-radius:4px;border:1px solid #444;">
      Roughness:
      <input id="slider-roughness" type="range" min="0.1" max="2.0" step="0.1" value="1.0" style="width:64px;vertical-align:middle;">
    </label>
  </div>
  <canvas id="doom-canvas" width="640" height="400" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <script type="module" src="assets/7cfe45f24226611f/index.js"></script>
</body>
</html>
